<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attune</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0d0d1a 0%,#1a0d2e 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;color:#fff}
    #app{width:100%;max-width:380px}
    .card{background:rgba(255,255,255,0.06);border-radius:24px;border:0.5px solid rgba(255,255,255,0.12);padding:2rem}
    .album-art{width:100%;aspect-ratio:1;border-radius:16px;margin-bottom:1.5rem;overflow:hidden;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:64px}
    .album-art img{width:100%;height:100%;object-fit:cover}
    .song-title{font-size:19px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .song-sub{font-size:13px;opacity:.6;margin-bottom:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .scrubber-wrap{margin-bottom:1.5rem}
    .scrubber-track{height:4px;background:rgba(255,255,255,0.15);border-radius:2px;cursor:pointer;position:relative;margin-bottom:8px}
    .scrubber-fill{height:100%;background:#1DB954;border-radius:2px;pointer-events:none}
    .scrubber-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#fff;pointer-events:none}
    .scrubber-times{display:flex;justify-content:space-between;font-size:12px;opacity:.5}
    .controls{display:flex;align-items:center;justify-content:center;gap:32px}
    .ctrl-btn{background:none;border:none;cursor:pointer;color:#fff;font-size:28px;opacity:.85;padding:8px;line-height:1}
    .ctrl-btn:hover{opacity:1}
    .play-btn{background:#1DB954;border:none;cursor:pointer;width:64px;height:64px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;color:#000;flex-shrink:0}
    .play-btn:hover{background:#1ed760}
    .taste-section{margin-top:1.5rem;padding-top:1.5rem;border-top:0.5px solid rgba(255,255,255,0.1)}
    .taste-label{font-size:11px;opacity:.4;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
    .taste-tags{display:flex;gap:8px;flex-wrap:wrap}
    .tag{font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.2)}
    .tag.green{background:rgba(29,185,84,0.2);border-color:rgba(29,185,84,0.4);color:#1DB954}
    .tag.orange{background:rgba(255,150,0,0.15);border-color:rgba(255,150,0,0.3);color:#ffaa44}
    .center{text-align:center;max-width:340px;margin:0 auto;padding:1rem}
    .center h1{font-size:32px;font-weight:500;margin:16px 0 8px}
    .center p{font-size:14px;opacity:.6;line-height:1.6;margin-bottom:2rem}
    .spotify-btn{background:#1DB954;border:none;color:#000;padding:14px 32px;border-radius:40px;font-size:15px;font-weight:500;cursor:pointer;width:100%}
    .spotify-btn:hover{background:#1ed760}
    .note{font-size:12px;opacity:.4;margin-top:16px}
    .footer{margin-top:12px;font-size:11px;opacity:.3;text-align:center}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const CLIENT_ID   = "5937b0c160f6465a8c9224752ed9f4bb";
const REDIRECT_URI = "https://scintillating-donut-fc23d8.netlify.app";
const SCOPES = "streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-read-currently-playing user-library-read user-top-read";

// ── PKCE auth ─────────────────────────────────────────────
function b64url(buf){return btoa(String.fromCharCode(...buf)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function genPKCE(){
  const v=b64url(crypto.getRandomValues(new Uint8Array(32)));
  const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));
  return{verifier:v,challenge:b64url(new Uint8Array(h))};
}
async function doLogin(){
  const{verifier,challenge}=await genPKCE();
  sessionStorage.setItem("pkce_v",verifier);
  const p=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,scope:SCOPES,code_challenge_method:"S256",code_challenge:challenge});
  window.location.href=`https://accounts.spotify.com/authorize?${p}`;
}
async function exchangeCode(code){
  const r=await fetch("https://accounts.spotify.com/api/token",{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:sessionStorage.getItem("pkce_v")||""}),
  });
  const d=await r.json();
  if(!d.access_token)throw new Error(d.error_description||"Token exchange failed");
  saveTokens(d);
}
async function tryRefresh(){
  const ref=localStorage.getItem("a_ref");
  if(!ref)return null;
  const r=await fetch("https://accounts.spotify.com/api/token",{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:ref}),
  });
  const d=await r.json();
  if(d.access_token){saveTokens(d);return d.access_token;}
  return null;
}
function saveTokens(d){
  localStorage.setItem("a_tok",d.access_token);
  localStorage.setItem("a_exp",Date.now()+d.expires_in*1000);
  if(d.refresh_token)localStorage.setItem("a_ref",d.refresh_token);
}
async function getToken(){
  if(Date.now()<parseInt(localStorage.getItem("a_exp")||0)-60000)return localStorage.getItem("a_tok");
  return tryRefresh();
}

// ── State ─────────────────────────────────────────────────
let screen="login";       // login | loading | player | error
let sdkReady=false;
let player=null;
let deviceId=null;
let pbState=null;         // playbackState from SDK
let pos=0;                // position in ms
let queue=[];
let qi=0;                 // queue index
let weights={energy:{},valence:{},tempo:{},decade:{}};
let playedLog={};         // id -> timestamp
let skipStreak=0;
let feats={};             // id -> audio features
let topArtists=[];
let scrubHist=[];
let pauseAt=null;
let advancing=false;
let lastUri=null;

// ── Helpers ───────────────────────────────────────────────
function fmt(ms){
  if(!ms&&ms!==0)return"0:00";
  const s=Math.floor(ms/1000);
  return`${Math.floor(s/60)}:${(s%60).toString().padStart(2,"0")}`;
}
function adjW(attrs,delta){
  for(const[k,v]of Object.entries(attrs))
    if(v!=null&&v!==undefined)weights[k][v]=(weights[k][v]||0)+delta;
}
function attrs(track){
  const yr=track?.album?.release_date?.slice(0,4);
  const f=feats[track?.id];
  const a={decade:yr?`${Math.floor(parseInt(yr)/10)*10}s`:null};
  if(f){
    a.energy=f.energy>0.66?"high":f.energy>0.33?"medium":"low";
    a.valence=f.valence>0.66?"happy":f.valence>0.33?"neutral":"sad";
    a.tempo=f.tempo>140?"fast":f.tempo>100?"mid":"slow";
  }
  return a;
}
function score(track){
  const a=attrs(track);
  let s=0;
  for(const[k,v]of Object.entries(a))if(v)s+=(weights[k]?.[v]||0);
  return s+Math.random()*1.5;
}
function notPlayed(id){
  const lp=playedLog[id];
  return!lp||(Date.now()-lp)>86400000;
}

// ── Spotify API ───────────────────────────────────────────
async function api(url,opts={}){
  const tok=await getToken();
  if(!tok){show("login");throw new Error("No token");}
  const r=await fetch("https://api.spotify.com/v1"+url,{
    ...opts,
    headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json",...(opts.headers||{})},
  });
  if(r.status===401){localStorage.clear();show("login");throw new Error("Auth expired");}
  if(r.status===204)return null;
  if(!r.ok){const t=await r.text().catch(()=>"");throw new Error(`Spotify ${r.status}: ${t}`);}
  return r.json();
}
async function safeFeats(ids){
  if(!ids||!ids.length)return;
  try{
    const r=await api(`/audio-features?ids=${ids.slice(0,100).join(",")}`);
    r?.audio_features?.forEach(f=>{if(f)feats[f.id]=f;});
  }catch(e){/* audio-features may not be available for new apps — skip silently */}
}
async function search(q,limit=6){
  try{const r=await api(`/search?q=${encodeURIComponent(q)}&type=track&limit=${limit}&market=US`);return r?.tracks?.items||[];}
  catch(e){return[];}
}
async function artistTopTracks(id){
  try{const r=await api(`/artists/${id}/top-tracks?market=US`);return r?.tracks||[];}
  catch(e){return[];}
}

// ── Discovery ─────────────────────────────────────────────
async function nextTracks(cur,skips){
  const now=Date.now();
  if(cur?.id)playedLog[cur.id]=now;
  let pool=[];

  if(skips>=3){
    // Mood pivot — pick opposite energy
    const topE=Object.entries(weights.energy).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const q=topE==="high"?"chill acoustic calm":topE==="low"?"energetic upbeat dance":"indie alternative feel-good";
    pool=await search(q,8);
    skipStreak=0;
  } else {
    // Pull from current artist + liked artists
    const aid=cur?.artists?.[0]?.id;
    const ids=[...(aid?[aid]:[]),...topArtists].filter(Boolean).slice(0,4);
    for(const id of ids){
      const t=await artistTopTracks(id);
      pool.push(...t);
    }
    // Top-up with search if thin
    if(pool.length<4&&cur?.artists?.[0]?.name){
      pool.push(...await search(cur.artists[0].name+" similar",6));
    }
  }

  pool=pool.filter(t=>t?.id&&t?.uri&&notPlayed(t.id)&&t.id!==cur?.id);
  pool=[...new Map(pool.map(t=>[t.id,t])).values()]; // dedupe

  await safeFeats(pool.map(t=>t.id));
  pool.sort((a,b)=>score(b)-score(a));
  return pool.slice(0,3);
}

// ── Playback controls ─────────────────────────────────────
async function playTrack(track){
  if(!deviceId||!track?.uri)return;
  try{
    await api(`/me/player/play?device_id=${deviceId}`,{
      method:"PUT",body:JSON.stringify({uris:[track.uri]}),
    });
    lastUri=track.uri;
  }catch(e){console.warn("play failed:",e);}
}

async function songEnded(){
  if(advancing)return;
  advancing=true;
  try{
    adjW(attrs(queue[qi]),2); // full listen = strong positive
    skipStreak=0;
    const next=await nextTracks(queue[qi],0);
    if(next.length)queue.splice(qi+1,0,...next);
    qi=Math.min(qi+1,queue.length-1);
    await playTrack(queue[qi]);
    draw();
  }finally{advancing=false;}
}

async function fwd(){
  if(advancing)return;
  advancing=true;
  try{
    const cur=queue[qi];
    const pct=pos/(pbState?.duration||1);
    adjW(attrs(cur),pct<0.5?-1.5:pct<0.75?-0.5:0.5);
    skipStreak++;
    const next=await nextTracks(cur,skipStreak);
    if(next.length)queue.splice(qi+1,0,...next);
    qi=Math.min(qi+1,queue.length-1);
    scrubHist=[];
    await playTrack(queue[qi]);
    draw();
  }finally{advancing=false;}
}

async function rev(){
  const cur=queue[qi];
  if(pos<3000){
    adjW(attrs(cur),2);
    qi=Math.max(0,qi-1);
    await playTrack(queue[qi]);
  }else{
    adjW(attrs(cur),1.5);
    try{await api("/me/player/seek?position_ms=0",{method:"PUT"});}catch(e){}
  }
  draw();
}

async function playPause(){
  if(!player)return;
  try{
    const s=await player.getCurrentState();
    if(!s)return;
    if(s.paused){
      if(pauseAt&&(Date.now()-pauseAt)>30000)adjW(attrs(queue[qi]),-0.5);
      pauseAt=null;
      await api(`/me/player/play?device_id=${deviceId}`,{method:"PUT"});
    }else{
      pauseAt=Date.now();
      await api("/me/player/pause",{method:"PUT"});
    }
  }catch(e){console.warn("playPause error:",e);}
}

function scrub(e){
  const rect=e.currentTarget.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  const dur=pbState?.duration||1;
  const newPos=ratio*dur,oldPos=pos,delta=newPos-oldPos;
  const cur=queue[qi],now=Date.now();
  scrubHist=[...scrubHist.filter(x=>now-x.t<5000),{from:oldPos,to:newPos,t:now}];
  if(scrubHist.filter(x=>Math.abs(x.from-x.to)<dur*0.2).length>=3)adjW(attrs(cur),2);
  if(newPos<2000&&oldPos>5000)adjW(attrs(cur),2);
  else if(delta<0)adjW(attrs(cur),0.5);
  else if(delta>dur*0.4)adjW(attrs(cur),-1);
  pos=newPos;
  api(`/me/player/seek?position_ms=${Math.floor(newPos)}`,{method:"PUT"}).catch(()=>{});
  draw();
}

// ── Seed / load ───────────────────────────────────────────
async function loadSeeds(){
  show("loading");
  try{
    // 1. Top tracks
    let tracks=[];
    try{const r=await api("/me/top/tracks?limit=20&time_range=medium_term");tracks=r?.items||[];}catch(e){}

    // 2. Top artists (for future recs)
    try{const r=await api("/me/top/artists?limit=10&time_range=medium_term");topArtists=(r?.items||[]).map(a=>a.id);}catch(e){}

    // 3. Fallback: saved tracks
    if(tracks.length<5){
      try{const r=await api("/me/tracks?limit=20&market=US");tracks=[...tracks,...(r?.items||[]).map(i=>i.track).filter(Boolean)];}catch(e){}
    }

    // 4. Last resort: search
    if(tracks.length<3){
      tracks=[...tracks,...await search("top hits",10)];
    }

    tracks=tracks.filter(t=>t?.id&&t?.uri);
    if(!tracks.length)throw new Error("No playable tracks found. Make sure your Spotify account has listening history, or try reconnecting.");

    await safeFeats(tracks.map(t=>t.id));
    queue=[...new Map(tracks.map(t=>[t.id,t])).values()].slice(0,20);
    qi=0;
    show("player");
    await playTrack(queue[0]);
  }catch(e){show("error",e.message);}
}

// ── SDK init ──────────────────────────────────────────────
function initSDK(){
  window.onSpotifyWebPlaybackSDKReady=()=>{
    sdkReady=true;
    player=new window.Spotify.Player({
      name:"Attune",
      getOAuthToken:async cb=>cb(await getToken()),
      volume:0.8,
    });

    player.addListener("ready",({device_id})=>{
      deviceId=device_id;
      loadSeeds();
    });

    player.addListener("not_ready",()=>{deviceId=null;});

    player.addListener("player_state_changed",s=>{
      if(!s)return;
      const prev=s.track_window?.previous_tracks||[];
      // Detect natural song end: paused at 0 and our track moved to previous
      if(!advancing&&s.paused&&s.position===0&&prev.some(t=>t.uri===lastUri)&&s.track_window?.current_track?.uri!==lastUri){
        songEnded();
        return;
      }
      pbState=s;
      pos=s.position;
      if(screen==="player")draw();
    });

    player.addListener("account_error",()=>show("error","Spotify Premium is required for in-browser playback."));
    player.addListener("authentication_error",()=>show("error","Authentication failed. Please reconnect."));
    player.addListener("initialization_error",({message})=>show("error","Player could not start: "+message));

    player.connect();

    // Position poll
    setInterval(async()=>{
      if(screen!=="player"||!player)return;
      try{
        const s=await player.getCurrentState();
        if(s){pbState=s;pos=s.position;draw();}
      }catch(e){}
    },500);
  };

  const s=document.createElement("script");
  s.src="https://sdk.scdn.co/spotify-player.js";
  s.async=true;
  document.body.appendChild(s);
}

// ── Render ────────────────────────────────────────────────
function show(s,msg){screen=s;_render(s,msg);}
function draw(){if(screen==="player")_render("player");}

function _render(s,msg){
  const app=document.getElementById("app");
  if(!app)return;

  if(s==="login"){
    app.innerHTML=`
      <div class="center">
        <div style="font-size:48px">🎵</div>
        <h1>Attune</h1>
        <p>Music that learns how you listen.<br>Connect your Spotify to get started.</p>
        <button class="spotify-btn" onclick="doLogin()">Connect with Spotify</button>
        <p class="note">Requires Spotify Premium for in-browser playback</p>
      </div>`;

  }else if(s==="loading"){
    app.innerHTML=`<div class="center"><p style="opacity:.6;margin:0">Loading your music...</p></div>`;

  }else if(s==="error"){
    app.innerHTML=`
      <div class="center">
        <div style="font-size:36px;margin-bottom:12px">⚠️</div>
        <p>${msg||"Something went wrong."}</p>
        <button class="spotify-btn" style="margin-top:1rem" onclick="doLogin()">Reconnect</button>
      </div>`;

  }else if(s==="player"){
    const cur=queue[qi];
    if(!cur)return;
    const art=cur.album?.images?.[0]?.url;
    const dur=pbState?.duration||0;
    const pct=dur?Math.min(100,(pos/dur)*100):0;
    const paused=pbState?.paused??true;
    const topE=Object.entries(weights.energy).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const topV=Object.entries(weights.valence).sort((a,b)=>b[1]-a[1])[0]?.[0];
    const artist=cur.artists?.map(a=>a.name).join(", ")||"Unknown";

    app.innerHTML=`
      <div class="card">
        <div class="album-art">${art?`<img src="${art}" alt="album art" loading="lazy"/>`:"🎵"}</div>
        <div class="song-title" title="${(cur.name||"").replace(/"/g,"")}">${cur.name||"—"}</div>
        <div class="song-sub">${artist}${cur.album?.name?" · "+cur.album.name:""}</div>
        <div class="scrubber-wrap">
          <div class="scrubber-track" id="sc">
            <div class="scrubber-fill" style="width:${pct.toFixed(1)}%"></div>
            <div class="scrubber-thumb" style="left:${pct.toFixed(1)}%"></div>
          </div>
          <div class="scrubber-times"><span>${fmt(pos)}</span><span>${fmt(dur)}</span></div>
        </div>
        <div class="controls">
          <button class="ctrl-btn" onclick="rev()" aria-label="Rewind or previous">⏮</button>
          <button class="play-btn" onclick="playPause()" aria-label="${paused?"Play":"Pause"}">${paused?"▶":"⏸"}</button>
          <button class="ctrl-btn" onclick="fwd()" aria-label="Skip">⏭</button>
        </div>
        ${topE||topV?`
        <div class="taste-section">
          <div class="taste-label">Your vibe right now</div>
          <div class="taste-tags">
            ${topE?`<span class="tag green">${topE} energy</span>`:""}
            ${topV?`<span class="tag">${topV}</span>`:""}
            ${skipStreak>=3?`<span class="tag orange">switching it up</span>`:""}
          </div>
        </div>`:""}
      </div>
      <div class="footer">Attune · powered by Spotify</div>`;

    document.getElementById("sc")?.addEventListener("click",scrub);
  }
}

// ── Boot ──────────────────────────────────────────────────
(async()=>{
  const p=new URLSearchParams(window.location.search);
  const code=p.get("code"),err=p.get("error");
  window.history.replaceState({},"",window.location.pathname);

  if(err){
    show("error",err==="access_denied"?"You declined Spotify access. Please try again.":`Spotify error: ${err}`);
    return;
  }
  if(code){
    show("loading");
    try{await exchangeCode(code);initSDK();}
    catch(e){show("error",e.message);}
    return;
  }
  const tok=await getToken();
  if(tok){show("loading");initSDK();}
  else show("login");
})();
</script>
</body>
</html>
